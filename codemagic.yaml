workflows:
  android-agent:
    name: Android Remote Lab Agent
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment:
      java: 17
      groups:
        - google_play

    scripts:
      - name: Assemble debug APK
        script: |
          gradle :app:assembleDebug

    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
