<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Android Remote Lab</title>
<style>
body{font-family:system-ui,sans-serif;max-width:560px;margin:32px auto;padding:20px}
button{padding:13px 16px;border:0;border-radius:10px;cursor:pointer;margin:6px 8px 6px 0}
input{width:100%;padding:12px;box-sizing:border-box;margin:8px 0 14px}
#status{margin-top:18px;white-space:pre-wrap}
</style>
</head>
<body>
<h1>Android Remote Lab</h1>
<p>Kontrol HP Android dari dashboard.</p>
<label>Device token</label>
<input id="token" type="password" autocomplete="off" placeholder="Masukkan token sekali">
<div>
<button id="health">Cek server</button>
<button id="open">Buka WhatsApp</button>
<button id="result">Cek hasil</button>
</div>
<h2>Status</h2>
<div id="status">Belum dicek.</div>
<script>
const status=document.getElementById('status');
const token=()=>document.getElementById('token').value.trim();
async function read(r){const t=await r.text();try{return JSON.parse(t)}catch{return {raw:t}}}
health.onclick=async()=>{
 status.textContent='Mengecek server...';
 try{const r=await fetch('/api/health');const d=await read(r);status.textContent='HTTP '+r.status+'\n'+JSON.stringify(d,null,2)}
 catch(e){status.textContent='Koneksi gagal: '+e.message}
};
open.onclick=async()=>{
 const t=token(); if(!t){status.textContent='Token belum diisi.';return}
 status.textContent='Mengirim command...';
 try{
  const r=await fetch('/api/command',{method:'POST',headers:{'Content-Type':'application/json','x-device-token':t},body:JSON.stringify({command:'OPEN_WHATSAPP'})});
  const d=await read(r);status.textContent='HTTP '+r.status+'\n'+JSON.stringify(d,null,2);
 }catch(e){status.textContent='Koneksi gagal: '+e.message}
};
result.onclick=async()=>{
 const t=token(); if(!t){status.textContent='Token belum diisi.';return}
 status.textContent='Mengecek hasil...';
 try{
  const r=await fetch('/api/result',{method:'GET',headers:{'x-device-token':t}});
  const d=await read(r);status.textContent='HTTP '+r.status+'\n'+JSON.stringify(d,null,2);
 }catch(e){status.textContent='Koneksi gagal: '+e.message}
};
</script>
</body>
</html>
